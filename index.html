<main class="app"><header><div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM4 14h6v6H4v-6Zm10 0h6v6h-6v-6Z" fill="currentColor"/></svg></div><div class="title"><h1>JSON Image Viewer</h1><p class="subtitle">读取 JSON 或 GitHub 仓库目录中的图片，以画廊方式浏览。无需后端，数据仅在当前浏览器处理。</p></div></div><div class="toolbar"><button class="icon-btn" id="themeBtn" type="button" title="跟随系统主题" aria-label="跟随系统主题">◐</button><a class="icon-btn" href="https://github.com/cloudsonly/JSON-Image-Viewer" target="_blank" rel="noopener noreferrer" title="GitHub 仓库" aria-label="打开 GitHub 仓库"><svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.04c0-3.34-1.42-4.04-1.42-4.04-.55-1.4-1.34-1.77-1.34-1.77-1.09-.75.08-.74.08-.74 1.2.08 1.84 1.23 1.84 1.23 1.07 1.83 2.8 1.3 3.48.99.11-.77.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.45 11.45 0 0 1 6 0c2.3-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.76.84 1.23 1.91 1.23 3.22 0 4.6-2.8 5.62-5.48 5.92-.43.37-.76.92-.76 1.85v2.74c0 .27.2.59.83.49A12 12 0 0 0 12 .7Z"/></svg></a></div></header>
<section class="panel loader-panel"><div class="loader-grid"><div class="input-wrap"><input id="urlInput" class="url-input" type="url" autocomplete="off" placeholder="JSON 地址，或 GitHub 目录，例如 https://github.com/owner/repo/tree/main/icons"><div class="input-tools"><button class="mini-btn" id="pasteBtn" type="button">粘贴</button><button class="mini-btn" id="clearBtn" type="button">清空</button></div></div><button class="primary-btn" id="loadBtn" type="button">加载</button></div><details class="adv" id="adv"><summary>GitHub Token（可选，避免接口限流）</summary><div class="adv-body"><input id="ghToken" class="url-input" type="password" autocomplete="off" placeholder="ghp_... 或 github_pat_..."><button class="ghost-btn" id="ghTokenClear" type="button">清除</button><div class="adv-tip">仅在浏览器本地保存，不会上传。未填写时 GitHub 目录接口限 60 次/小时（按 IP），填写后 5000 次/小时。Token 只需 public_repo 读取权限。</div></div></details><div class="status" id="status"><div></div></div><div class="history" id="history"><div class="history-head"><span class="history-title">最近访问</span><button class="ghost-btn" id="clearHistory" type="button">清空历史</button></div><div class="history-list" id="historyList"></div></div></section>
<section class="panel gallery-panel"><div class="gallery-head"><div class="title-block"><h2 class="gallery-title">图片画廊</h2><div class="gallery-meta" id="galleryMeta">尚未加载数据</div></div><div class="json-info" id="jsonInfo" hidden></div><div class="gallery-tools"><select id="dirFilter" class="dir-select" aria-label="按目录筛选" hidden></select><input id="searchInput" class="search" type="search" placeholder="搜索名称 / 路径 / URL"></div></div><div class="gallery" id="gallery"><div class="empty"><div class="empty-icon">▧</div><strong>等待加载图片</strong><span>输入一个 JSON 地址后开始浏览</span></div></div><div class="gallery-sentinel" id="sentinel" hidden></div></section><footer>JSON Image Viewer · 数据仅在当前浏览器处理</footer></main>
<div class="modal" id="modal" aria-hidden="true"><div class="viewer-top"><div class="viewer-info"><div class="viewer-title" id="viewerTitle"></div><div class="viewer-subtitle" id="viewerSubtitle"></div><div class="viewer-dimensions" id="viewerDimensions"></div></div><div class="viewer-actions"><button class="viewer-btn" id="zoomOut" type="button" title="缩小">−</button><button class="viewer-btn" id="zoomReset" type="button" title="重置">100%</button><button class="viewer-btn" id="zoomIn" type="button" title="放大">＋</button><button class="viewer-btn" id="copyUrl" type="button" title="复制图片地址">⧉</button><button class="viewer-btn" id="openImage" type="button" title="新窗口打开">↗</button><button class="viewer-btn" id="closeModal" type="button" title="关闭">×</button></div></div><div class="viewer-stage"><button class="nav-btn prev" id="prevBtn" type="button" aria-label="上一张">‹</button><div class="viewer-image-wrap" id="viewerWrap"><img class="viewer-image" id="viewerImage" alt=""></div><button class="nav-btn next" id="nextBtn" type="button" aria-label="下一张">›</button><div class="viewer-count" id="viewerCount"></div></div></div>
<script>
const $=s=>document.querySelector(s),state={items:[],filtered:[],index:0,zoom:1,panX:0,panY:0,rendered:0,dir:'',controller:null,meta:{}},els={url:$('#urlInput'),load:$('#loadBtn'),status:$('#status'),gallery:$('#gallery'),meta:$('#galleryMeta'),search:$('#searchInput'),dirFilter:$('#dirFilter'),history:$('#historyList'),jsonInfo:$('#jsonInfo'),modal:$('#modal'),viewerImage:$('#viewerImage'),viewerWrap:$('#viewerWrap'),sentinel:$('#sentinel'),adv:$('#adv'),ghToken:$('#ghToken'),viewerTitle:$('#viewerTitle'),viewerSubtitle:$('#viewerSubtitle'),viewerDimensions:$('#viewerDimensions'),viewerCount:$('#viewerCount')};
function status(message,type='success'){els.status.dataset.type=type;els.status.classList.add('show');els.status.firstElementChild.textContent=message}function clearStatus(){els.status.classList.remove('show');els.status.firstElementChild.textContent=''}function isImageUrl(v){return typeof v==='string'&&(/^(https?:)?\/\//i.test(v)||/^data:image\//i.test(v)||/^blob:/i.test(v))}function titleFromUrl(url){try{const p=new URL(url,location.href),n=p.pathname.split('/').filter(Boolean).pop();return decodeURIComponent(n||p.hostname)}catch{return url}}
const imageKeys=['url','imageUrl','src','image','icon','thumbnail','preview','cover','logo'],arrayKeys=['images','icons','items','list','results','photos','data','entries'];
function extractImages(value,out=[],seen=new Set()){if(value==null||seen.has(value))return out;if(typeof value==='string'){if(isImageUrl(value))out.push({url:value,name:titleFromUrl(value)});return out}if(typeof value!=='object')return out;seen.add(value);if(Array.isArray(value)){value.forEach(v=>extractImages(v,out,seen));return out}for(const k of imageKeys)if(isImageUrl(value[k]))out.push({url:value[k],name:value.name||value.title||titleFromUrl(value[k])});for(const k of arrayKeys)if(value[k]!=null)extractImages(value[k],out,seen);for(const[k,v]of Object.entries(value)){if(imageKeys.includes(k)||arrayKeys.includes(k))continue;if(typeof v==='object')extractImages(v,out,seen)}return out}
function uniqueItems(items){const seen=new Set();return items.filter(x=>{if(seen.has(x.url))return false;seen.add(x.url);return true})}
function textValue(v){if(typeof v==='string')return v.trim();if(Array.isArray(v))return v.map(textValue).filter(Boolean).join(', ');if(v&&typeof v==='object')return textValue(v.name||v.title||v.author||v.username||v.label||v.text||'');return ''}
function iconFromValue(v){if(typeof v==='string'&&isImageUrl(v))return v;if(Array.isArray(v)){for(const x of v){const u=iconFromValue(x);if(u)return u}}if(v&&typeof v==='object')return iconFromValue(v.src||v.url||v.icon||v.image||v.href||v);return ''}
function extractMeta(data){if(!data||typeof data!=='object'||Array.isArray(data))return{};const icon=iconFromValue(data.icons)||iconFromValue(data.icon)||iconFromValue(data.logo)||iconFromValue(data.image);return{name:textValue(data.name||data.title),description:textValue(data.description||data.desc||data.summary),author:textValue(data.author||data.authors||data.creator||data.owner),icon}}
function renderMeta(){const m=state.meta||{};const has=m.name||m.description||m.author||m.icon;if(!has){els.jsonInfo.hidden=true;els.jsonInfo.innerHTML='';return}els.jsonInfo.hidden=false;els.jsonInfo.innerHTML=`${m.icon?`<div class="json-info-icon"><img src="${escapeAttr(m.icon)}" alt="" referrerpolicy="no-referrer"></div>`:''}<div class="json-info-body">${m.name?`<div class="json-info-name" title="${escapeAttr(m.name)}">${escapeHtml(m.name)}</div>`:''}${m.description?`<div class="json-info-description" title="${escapeAttr(m.description)}">${escapeHtml(m.description)}</div>`:''}${m.author?`<div class="json-info-author" title="${escapeAttr(m.author)}">${escapeHtml(m.author)}</div>`:''}</div>`}
const PAGE_SIZE=120,MAX_TREE_ITEMS=3000,IMG_EXT=/\.(png|jpe?g|gif|webp|avif|svg|bmp|ico)$/i,EMPTY_HTML='<div class="empty"><div class="empty-icon">▧</div><strong>等待加载图片</strong><span>输入 JSON 或 GitHub 目录地址后开始浏览</span></div>';
function parseGithubUrl(input){let u;try{u=new URL(input)}catch{return null}if(!/(^|\.)github\.com$/i.test(u.hostname))return null;const seg=u.pathname.split('/').filter(Boolean);if(seg.length<2)return null;const owner=decodeURIComponent(seg[0]),repo=decodeURIComponent(seg[1]).replace(/\.git$/i,'');if(!owner||!repo)return null;const rest=seg.slice(2);if(!rest.length)return{owner,repo,kind:'tree',parts:[]};if(rest[0]!=='tree'&&rest[0]!=='blob')return null;return{owner,repo,kind:rest[0],parts:rest.slice(1).map(decodeURIComponent)}}
function ghRawUrl(owner,repo,ref,path){return `https://raw.githubusercontent.com/${owner}/${repo}/${ref}/${path.split('/').map(encodeURIComponent).join('/')}`}
async function loadGithub(gh,originalUrl){if(state.controller)state.controller.abort();const controller=new AbortController();state.controller=controller;els.load.disabled=true;status('正在读取 GitHub 目录…','loading');const token=(els.ghToken.value||'').trim(),headers={Accept:'application/vnd.github+json'};if(token)headers.Authorization=`Bearer ${token}`;const call=async p=>{const res=await fetch('https://api.github.com'+p,{signal:controller.signal,headers});if(res.status===401)throw Object.assign(new Error('Token 无效或已过期'),{kind:'token'});if(res.status===403||res.status===429){const body=await res.json().catch(()=>({}));if(/rate limit/i.test(body.message||'')||res.headers.get('x-ratelimit-remaining')==='0')throw Object.assign(new Error('rate'),{kind:'rate',reset:Number(res.headers.get('x-ratelimit-reset'))*1000});throw Object.assign(new Error('无权访问该仓库（私有仓库需填 Token）'),{kind:'denied'})}if(res.status===404)throw Object.assign(new Error('仓库或目录不存在'),{kind:'404'});if(!res.ok)throw new Error('HTTP '+res.status);return res.json()};try{const parts=gh.parts.slice();let wantFile='';if(gh.kind==='blob')wantFile=parts.pop()||'';const cands=[];if(!parts.length)cands.push({ref:'',path:''});else for(let i=1;i<=parts.length;i++)cands.push({ref:parts.slice(0,i).join('/'),path:parts.slice(i).join('/')});let tree=null,usedRef='',usedPath='';for(const c of cands){if(controller.signal.aborted)break;let ref=c.ref;if(!ref){const repoMeta=await call(`/repos/${gh.owner}/${gh.repo}`);ref=repoMeta.default_branch}let t;try{t=await call(`/repos/${gh.owner}/${gh.repo}/git/trees/${encodeURIComponent(ref)}?recursive=1`)}catch(e){if(e.kind)throw e;continue}tree=t;usedRef=ref;usedPath=c.path;const pre=usedPath?usedPath.replace(/\/+$/,'')+'/':'';if(t.tree.some(n=>n.type==='blob'&&n.path.startsWith(pre)&&IMG_EXT.test(n.path)))break;if(gh.kind==='blob')break}if(!tree)throw new Error('无法读取该仓库，请检查地址');const prefix=usedPath?usedPath.replace(/\/+$/,'')+'/':'';let blobs=tree.tree.filter(n=>n.type==='blob'&&n.path.startsWith(prefix)&&IMG_EXT.test(n.path));if(wantFile)blobs=blobs.filter(n=>n.path.slice(prefix.length)===wantFile||n.path.endsWith('/'+wantFile));const capped=blobs.length>MAX_TREE_ITEMS;if(capped)blobs=blobs.slice(0,MAX_TREE_ITEMS);const items=blobs.map(n=>{const rel=n.path.slice(prefix.length),cut=rel.lastIndexOf('/');return{url:ghRawUrl(gh.owner,gh.repo,usedRef,n.path),name:cut<0?rel:rel.slice(cut+1),dir:cut<0?'':rel.slice(0,cut)}});state.items=uniqueItems(items);state.dir='';state.meta={name:`${gh.owner}/${gh.repo}`,description:`${usedPath||'/'} · ${usedRef}`,icon:state.items[0]?state.items[0].url:''};els.search.value='';render();saveHistory(originalUrl,state.meta);if(!state.items.length)status('目录中没有找到图片文件','warning');else status(`加载成功，共 ${state.items.length} 张图片${capped?'（超过 '+MAX_TREE_ITEMS+' 张已截断）':''}${tree.truncated?'（仓库过大，列表可能不完整）':''}`,'success')}catch(e){if(e.name==='AbortError')status('加载超时或请求已取消','error');else if(e.kind==='rate'){els.adv.open=true;const at=e.reset?new Date(e.reset).toLocaleTimeString('zh-CN',{hour12:false}):'';status(`GitHub 接口已限流（未登录 60 次/小时${at?'，约 '+at+' 恢复':''}）。在上方「GitHub Token」中填入 Token 后重试即可。`,'warning')}else if(e.kind==='token'){els.adv.open=true;status('GitHub Token 无效或已过期，请重新填写','error')}else status(`加载失败：${e.message}`,'error')}finally{if(state.controller===controller)state.controller=null;els.load.disabled=false}}

function cardHtml(item,i){return `<article class="card" data-index="${i}"><div class="thumb" data-index="${i}" title="点击查看大图"><img src="${escapeAttr(item.url)}" alt="${escapeAttr(item.name)}" loading="lazy" decoding="async" referrerpolicy="no-referrer"></div><div class="card-body"><div class="name" title="${escapeAttr(item.name)}">${escapeHtml(item.name)}</div><div class="url" title="${escapeAttr(item.url)}">${escapeHtml(item.url)}</div><div class="card-actions"><button class="card-btn" data-action="copy" data-index="${i}" type="button">复制地址</button><button class="card-btn" data-action="open" data-index="${i}" type="button">新窗口打开</button></div></div></article>`}
function updateGalleryMeta(query=''){const total=state.items.length,shown=state.filtered.length;if(!total){els.meta.textContent='尚未加载数据';return}const parts=[`共 ${total} 张图片`];if(state.dir)parts.push(`目录 ${state.dir}`);if(state.dir||query)parts.push(`当前 ${shown} 张`);if(shown>state.rendered)parts.push(`已显示 ${state.rendered} 张`);els.meta.textContent=parts.join(' · ')}
function appendCards(){const total=state.filtered.length;if(state.rendered>=total){els.sentinel.hidden=true;return}const end=Math.min(state.rendered+PAGE_SIZE,total);let html='';for(let i=state.rendered;i<end;i++)html+=cardHtml(state.filtered[i],i);els.gallery.insertAdjacentHTML('beforeend',html);state.rendered=end;els.sentinel.hidden=state.rendered>=total;els.sentinel.textContent=els.sentinel.hidden?'':`已显示 ${state.rendered} / ${total} · 继续向下滚动加载更多`;updateGalleryMeta(els.search.value)}
function renderGallery(query=''){state.rendered=0;els.gallery.innerHTML='';if(!state.filtered.length){els.gallery.innerHTML=state.items.length?'<div class="empty"><div class="empty-icon">⌕</div><strong>没有匹配的图片</strong><span>请尝试其他搜索关键词</span></div>':EMPTY_HTML;els.sentinel.hidden=true;updateGalleryMeta(query);return}appendCards();updateGalleryMeta(query)}
function dirFromUrl(url){try{const p=new URL(url,location.href).pathname.split('/').filter(Boolean);p.pop();return p.join('/')}catch{return ''}}
function inDir(it){const d=it.dir||'';return !state.dir||d===state.dir||d.startsWith(state.dir+'/')}
function applyFilter(query=''){const q=query.trim().toLowerCase();state.filtered=state.items.filter(it=>inDir(it)&&(!q||`${it.name} ${it.dir||''} ${it.url}`.toLowerCase().includes(q)));renderGallery(q)}
function renderDirFilter(){const counts=new Map();state.items.forEach(it=>{const d=it.dir||'';counts.set(d,(counts.get(d)||0)+1)});const all=[...counts.keys()].filter(d=>d).sort((a,b)=>a.localeCompare(b,'zh')),dirs=all.slice(0,200);if(state.dir&&!counts.has(state.dir))state.dir='';els.dirFilter.innerHTML=[`<option value="">全部目录（${state.items.length}）</option>`,...dirs.map(d=>`<option value="${escapeAttr(d)}">${escapeHtml(d)}（${counts.get(d)}）</option>`),all.length>dirs.length?`<option value="" disabled>…另有 ${all.length-dirs.length} 个目录，可用搜索框按路径过滤</option>`:''].join('');els.dirFilter.value=state.dir;els.dirFilter.hidden=!all.length}
function render(){renderMeta();renderDirFilter();applyFilter(els.search.value)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(s){return escapeHtml(s)}function formatDimensions(w,h){return w&&h?`${w} × ${h} px`:''}function updateImageDimensions(){els.viewerDimensions.textContent=formatDimensions(els.viewerImage.naturalWidth,els.viewerImage.naturalHeight)}
function applyView(){const z=state.zoom,btn=$('#zoomReset');els.viewerImage.style.transform=`translate(${state.panX}px,${state.panY}px) scale(${z})`;els.viewerWrap.classList.toggle('is-zoomed',z>1.001);btn.textContent=`${Math.round(z*100)}%`;btn.title=z>1.001?'恢复适应屏幕（双击图片或按 0）':'图片已适应屏幕大小'}
function resetView(){state.zoom=1;state.panX=0;state.panY=0;applyView()}
function openViewer(index){if(!state.filtered.length)return;state.index=Math.max(0,Math.min(index,state.filtered.length-1));els.modal.classList.add('open');els.modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';updateViewer()}
function closeViewer(){els.modal.classList.remove('open');els.modal.setAttribute('aria-hidden','true');document.body.style.overflow='';resetView()}
function preloadNeighbors(){const n=state.filtered.length;if(n<2)return;[1,-1].forEach(d=>{const it=state.filtered[(state.index+d+n)%n];if(it){const img=new Image();img.decoding='async';img.src=it.url}})}
function updateViewer(){const item=state.filtered[state.index];if(!item)return;resetView();els.viewerImage.src=item.url;els.viewerImage.alt=item.name;els.viewerTitle.textContent=item.name;els.viewerSubtitle.textContent=item.url;els.viewerDimensions.textContent='加载中…';els.viewerCount.textContent=`${state.index+1} / ${state.filtered.length}`;if(els.viewerImage.complete&&els.viewerImage.naturalWidth)updateImageDimensions();preloadNeighbors()}
function changeViewer(delta){if(!state.filtered.length)return;state.index=(state.index+delta+state.filtered.length)%state.filtered.length;updateViewer()}
function setZoom(z){state.zoom=Math.max(.25,Math.min(6,z));applyView()}
function toggleZoom(){if(state.zoom>1.001)resetView();else{state.zoom=2;applyView()}}
async function copyText(text){try{await navigator.clipboard.writeText(text);status('图片地址已复制','success')}catch{status('复制失败，请手动复制','warning')}}
function readHistory(){try{const h=JSON.parse(localStorage.getItem('jiv-history')||'[]');return Array.isArray(h)?h:[]}catch{return[]}}function normalizeHistoryItem(item){if(typeof item==='string')return{url:item,meta:{}};if(item&&typeof item==='object'&&item.url)return{url:item.url,meta:item.meta||{}};return null}function saveHistory(url,meta){let h=readHistory().map(normalizeHistoryItem).filter(Boolean);h=[{url,meta:meta||{}},...h.filter(x=>x.url!==url)].slice(0,8);localStorage.setItem('jiv-history',JSON.stringify(h));renderHistory()}function renderHistory(){const h=readHistory().map(normalizeHistoryItem).filter(Boolean);els.history.innerHTML=h.length?h.map((item,i)=>{const m=item.meta||{},icon=m.icon?`<div class="history-icon"><img src="${escapeAttr(m.icon)}" alt="" loading="lazy" referrerpolicy="no-referrer"></div>`:'<div class="history-icon">▧</div>';return `<div class="history-item">${icon}<button class="history-load" data-history="${i}" type="button">${m.name?`<span class="history-name" title="${escapeAttr(m.name)}">${escapeHtml(m.name)}</span>`:''}${m.description?`<span class="history-description" title="${escapeAttr(m.description)}">${escapeHtml(m.description)}</span>`:''}${m.author?`<span class="history-author" title="${escapeAttr(m.author)}">${escapeHtml(m.author)}</span>`:''}<span class="history-url" title="${escapeAttr(item.url)}">${escapeHtml(item.url)}</span></button><button class="history-remove" data-remove-history="${i}" type="button" aria-label="删除">×</button></div>`}).join(''):'<div class="history-empty">暂无历史记录</div>'}
async function load(){const url=els.url.value.trim();if(!url){status('请输入 JSON 或 GitHub 目录地址','warning');els.url.focus();return}const gh=parseGithubUrl(url);if(gh)return loadGithub(gh,url);if(state.controller)state.controller.abort();const controller=new AbortController();state.controller=controller;els.load.disabled=true;status('正在加载 JSON…','loading');try{const timer=setTimeout(()=>controller.abort(),15000),res=await fetch(url,{signal:controller.signal,headers:{Accept:'application/json,text/plain,*/*'}});clearTimeout(timer);if(!res.ok)throw new Error(`HTTP ${res.status}`);const data=await res.json(),items=uniqueItems(extractImages(data));if(controller.signal.aborted)throw new Error('请求已取消');state.items=items.map(it=>({...it,dir:dirFromUrl(it.url)}));state.dir='';state.meta=extractMeta(data);els.search.value='';render();saveHistory(url,state.meta);status(`加载成功，共发现 ${items.length} 张图片`,'success');if(!items.length)status('JSON 已加载，但没有识别到图片地址','warning')}catch(e){if(e.name==='AbortError')status('加载超时或请求已取消','error');else status(`加载失败：${e.message}`,'error')}finally{if(state.controller===controller)state.controller=null;els.load.disabled=false}}
$('#loadBtn').addEventListener('click',load);els.url.addEventListener('keydown',e=>{if(e.key==='Enter')load()});els.ghToken.value=localStorage.getItem('jiv-gh-token')||'';els.ghToken.addEventListener('change',()=>{const v=els.ghToken.value.trim();if(v)localStorage.setItem('jiv-gh-token',v);else localStorage.removeItem('jiv-gh-token');status(v?'Token 已保存到本机，仅浏览器可见':'已清除本机 Token',v?'success':'warning')});$('#ghTokenClear').addEventListener('click',()=>{els.ghToken.value='';localStorage.removeItem('jiv-gh-token');status('已清除本机 Token','warning')});let searchFrame=0;els.search.addEventListener('input',()=>{cancelAnimationFrame(searchFrame);const value=els.search.value;searchFrame=requestAnimationFrame(()=>applyFilter(value))});els.dirFilter.addEventListener('change',()=>{state.dir=els.dirFilter.value;applyFilter(els.search.value)});$('#clearBtn').addEventListener('click',()=>{els.url.value='';clearStatus();els.url.focus()});$('#pasteBtn').addEventListener('click',async()=>{try{els.url.value=await navigator.clipboard.readText();status('已粘贴剪贴板内容','success')}catch{status('无法读取剪贴板，请手动粘贴','warning')}});els.gallery.addEventListener('click',e=>{const thumb=e.target.closest('.thumb');if(thumb){openViewer(Number(thumb.dataset.index));return}const btn=e.target.closest('[data-action]');if(!btn)return;const item=state.filtered[Number(btn.dataset.index)];if(!item)return;if(btn.dataset.action==='copy')copyText(item.url);else window.open(item.url,'_blank','noopener,noreferrer')});
$('#closeModal').addEventListener('click',closeViewer);$('#prevBtn').addEventListener('click',()=>changeViewer(-1));$('#nextBtn').addEventListener('click',()=>changeViewer(1));$('#zoomIn').addEventListener('click',()=>setZoom(state.zoom+.25));$('#zoomOut').addEventListener('click',()=>setZoom(state.zoom-.25));$('#zoomReset').addEventListener('click',resetView);$('#copyUrl').addEventListener('click',()=>copyText(state.filtered[state.index]?.url||''));$('#openImage').addEventListener('click',()=>{const u=state.filtered[state.index]?.url;if(u)window.open(u,'_blank','noopener,noreferrer')});els.viewerImage.addEventListener('load',updateImageDimensions);
let loadFrame=0;function maybeLoadMore(){if(loadFrame)return;loadFrame=requestAnimationFrame(()=>{loadFrame=0;if(state.rendered>=state.filtered.length)return;const rect=els.sentinel.getBoundingClientRect();if(rect.top<innerHeight+900)appendCards()})}window.addEventListener('scroll',maybeLoadMore,{passive:true});window.addEventListener('resize',maybeLoadMore,{passive:true});
let touchStartX=0,touchStartY=0,touchStartTime=0,touchMoved=false;els.viewerImage.addEventListener('touchstart',e=>{if(!els.modal.classList.contains('open')||!e.touches[0])return;const t=e.touches[0];touchStartX=t.clientX;touchStartY=t.clientY;touchStartTime=Date.now();touchMoved=false},{passive:true});els.viewerImage.addEventListener('touchmove',e=>{if(!e.touches[0])return;const t=e.touches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;if(Math.abs(dx)>12||Math.abs(dy)>12)touchMoved=true},{passive:true});els.viewerImage.addEventListener('touchend',e=>{if(!els.modal.classList.contains('open')||!e.changedTouches[0])return;if(state.zoom>1.001)return;const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY,dt=Date.now()-touchStartTime;if(dt<600&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.2){changeViewer(dx<0?1:-1);touchMoved=true}}, {passive:true});
let dragging=false,dragMoved=false,dragStartX=0,dragStartY=0,dragPanX=0,dragPanY=0,closeTimer=0;
els.viewerWrap.addEventListener('pointerdown',e=>{if(state.zoom<=1.001||e.button>0)return;dragging=true;dragMoved=false;dragStartX=e.clientX;dragStartY=e.clientY;dragPanX=state.panX;dragPanY=state.panY;els.viewerWrap.classList.add('is-dragging');try{els.viewerWrap.setPointerCapture(e.pointerId)}catch{}});
els.viewerWrap.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-dragStartX,dy=e.clientY-dragStartY;if(Math.abs(dx)>3||Math.abs(dy)>3)dragMoved=true;state.panX=dragPanX+dx;state.panY=dragPanY+dy;els.viewerImage.style.transform=`translate(${state.panX}px,${state.panY}px) scale(${state.zoom})`});
function endDrag(e){if(!dragging)return;dragging=false;els.viewerWrap.classList.remove('is-dragging');try{if(e&&els.viewerWrap.hasPointerCapture(e.pointerId))els.viewerWrap.releasePointerCapture(e.pointerId)}catch{}}
els.viewerWrap.addEventListener('pointerup',endDrag);els.viewerWrap.addEventListener('pointercancel',endDrag);
els.viewerImage.addEventListener('click',()=>{if(touchMoved){touchMoved=false;return}if(dragMoved){dragMoved=false;return}if(state.zoom>1.001)return;clearTimeout(closeTimer);closeTimer=setTimeout(closeViewer,240)});
els.viewerImage.addEventListener('dblclick',()=>{clearTimeout(closeTimer);toggleZoom()});
els.modal.addEventListener('click',e=>{if(dragMoved){dragMoved=false;return}const t=e.target;if(t===els.modal||t.classList.contains('viewer-stage')||(t===els.viewerWrap&&state.zoom<=1.001))closeViewer()});
document.addEventListener('keydown',e=>{if(!els.modal.classList.contains('open'))return;if(e.key==='Escape')closeViewer();if(e.key==='ArrowLeft')changeViewer(-1);if(e.key==='ArrowRight')changeViewer(1);if(e.key==='+'||e.key==='=')setZoom(state.zoom+.25);if(e.key==='-')setZoom(state.zoom-.25);if(e.key==='0')resetView()});
els.viewerImage.addEventListener('wheel',e=>{if(!els.modal.classList.contains('open'))return;e.preventDefault();setZoom(state.zoom+(e.deltaY<0?.15:-.15))},{passive:false});
$('#clearHistory').addEventListener('click',()=>{localStorage.removeItem('jiv-history');renderHistory()});els.history.addEventListener('click',e=>{const loadBtn=e.target.closest('[data-history]');if(loadBtn){const h=readHistory().map(normalizeHistoryItem).filter(Boolean),item=h[Number(loadBtn.dataset.history)];if(item){els.url.value=item.url;load()}return}const rm=e.target.closest('[data-remove-history]');if(rm){const h=readHistory();h.splice(Number(rm.dataset.removeHistory),1);localStorage.setItem('jiv-history',JSON.stringify(h));renderHistory()}});
const mediaTheme=window.matchMedia('(prefers-color-scheme: dark)'),themeBtn=$('#themeBtn');function syncThemeIndicator(){themeBtn.textContent=mediaTheme.matches?'☀':'☾';themeBtn.title=`跟随系统主题：${mediaTheme.matches?'深色':'浅色'}`;themeBtn.setAttribute('aria-label',themeBtn.title)}syncThemeIndicator();if(mediaTheme.addEventListener)mediaTheme.addEventListener('change',syncThemeIndicator);else mediaTheme.addListener(syncThemeIndicator);renderHistory();applyView();
</script>
